<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/asset/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header class="site-header">
        <h1>
          <a href="{{ "/" | relative_url }}">{{ site.title }}</a>
        </h1>
        <p class="site-subtitle">{{ site.description }}</p>
        <nav class="social-links" aria-label="Contact and profile links">
          <a href="mailto:ziqi.huang2@mail.mcgill.ca">
            <i class="fas fa-envelope" aria-hidden="true"></i><span>Email</span>
          </a>
          <a href="https://www.linkedin.com/in/ziqi-huang-334b88201/">
            <i class="fab fa-linkedin" aria-hidden="true"></i><span>LinkedIn</span>
          </a>
          <a href="https://scholar.google.com/citations?hl=zh-CN&user=Rc1YU6sAAAAJ">
            <i class="fas fa-graduation-cap google-scholar-icon" aria-hidden="true"></i><span>Google Scholar</span>
          </a>
          <a href="https://github.com/ZiqiHuang11">
            <i class="fab fa-github" aria-hidden="true"></i><span>GitHub</span>
          </a>
        </nav>
      </header>
      <main class="site-content">
        {{ content }}
      </main>
      <footer>
        <p><small>Hosted on GitHub Pages &mdash; Theme by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
